# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

# Define trigger events: runs on pushes and pull requests targeting the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Run pipeline on the latest Ubuntu runner environment
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test against current LTS and modern Node.js runtime versions
        node-version: [20.x, 22.x]

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up the specified Node.js version and enable npm caching
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Step 3: Clean install dependencies using package-lock.json with legacy peer deps flag
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Step 4: Run API generation script if present in package.json
      - name: Generate API
        run: npm run generate:api --if-present

      # Step 5: Compile/build the Angular application if build script is present
      - name: Build project
        run: npm run build --if-present

      # Step 6: Execute Jest unit tests
      - name: Run unit tests
        run: npm test